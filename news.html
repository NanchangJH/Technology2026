<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新闻动态 · 科技部</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="main-container">
        <!-- 头部 -->
        <header class="header">
            <div class="logo">
                <i class="fas fa-microchip"></i>
            </div>
            <div class="welcome">
                <h1>科技部新闻动态</h1>
                <div class="subhead">
                    <span class="tag"><i class="fas fa-newspaper"></i> 全部文章</span>
                </div>
            </div>
        </header>

        <!-- 返回首页 -->
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> 返回首页</a>

        <!-- 新闻列表 -->
        <div class="section-head" style="margin-top:1.5rem;">
            <div class="section-title">
                <span class="bar"></span>
                <h2>全部文章</h2>
            </div>
            <p class="section-desc">共 <span id="news-count">0</span> 篇文章</p>
        </div>

        <div class="news-list" id="news-list">
            <div class="loading"><i class="fas fa-spinner fa-spin"></i> 加载中...</div>
        </div>
    </div>

    <script src="js/news-loader.js"></script>
</body>
</html>
