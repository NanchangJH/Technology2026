<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章 · 科技部</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="detail-container">
        <a href="../news.html" class="back-link"><i class="fas fa-arrow-left"></i> 返回新闻列表</a>

        <div class="detail-header">
            <div class="avatar-ring">
                <div class="avatar"><i class="fas fa-newspaper"></i></div>
            </div>
            <div class="detail-title">
                <h2 id="article-title">加载中...</h2>
                <div class="role" id="article-date">—</div>
            </div>
        </div>

        <div class="markdown-body" id="markdown-content">
            <div class="loading"><i class="fas fa-spinner fa-spin"></i> 加载中...</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(location.search);
            const file = params.get('file');          // 例如 2026-01-01-example.md
            const titleParam = params.get('title');   // 可选
            const container = document.getElementById('markdown-content');
            const titleEl = document.getElementById('article-title');
            const dateEl = document.getElementById('article-date');

            if (!file) {
                container.innerHTML = '<p style="color:#b33;">未指定文章文件</p>';
                return;
            }

            // 标题
            if (titleParam) titleEl.textContent = titleParam;

            // 从文件名推日期（yyyy-mm-dd-xxx.md）
            const m = file.match(/^(\d{4}-\d{2}-\d{2})/);
            if (m) dateEl.textContent = m[1];

            try {
                const res = await fetch('../news/posts/' + file);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const text = await res.text();
                container.innerHTML = (typeof marked !== 'undefined')
                    ? marked.parse(text)
                    : '<pre style="white-space:pre-wrap;">' + text.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</pre>';
            } catch (err) {
                container.innerHTML = '<p style="color:#b33;">文章加载失败：' + err.message + '。请确认文件存在且通过本地服务器预览。</p>';
            }
        });
    </script>
</body>
</html>
