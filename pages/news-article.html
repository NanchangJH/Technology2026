<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章 · 科技部</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <!-- marked 锁定 4.3.0（UMD 全局稳定），并带备用 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
    <script>
        if (typeof marked === 'undefined') {
            document.write('<script src="https://unpkg.com/marked@4.3.0/marked.min.js"><\/script>');
        }
    </script>
    <script>
        if (typeof marked === 'undefined') {
            document.write('<script src="https://cdn.bootcdn.net/ajax/libs/marked/4.3.0/marked.min.js"><\/script>');
        }
    </script>
</head>
<body>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="detail-container">
        <a href="../news.html" class="back-link"><i class="fas fa-arrow-left"></i> 返回新闻列表</a>

        <div class="detail-header">
            <div class="avatar-ring">
                <div class="avatar"><i class="fas fa-newspaper"></i></div>
            </div>
            <div class="detail-title">
                <h2 id="article-title">加载中...</h2>
                <div class="role" id="article-date">—</div>
            </div>
        </div>

        <div class="markdown-body" id="markdown-content">
            <div class="loading"><i class="fas fa-spinner fa-spin"></i> 加载中...</div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', async () => {
        const params = new URLSearchParams(location.search);
        const file = params.get('file');
        const titleParam = params.get('title');
        const container = document.getElementById('markdown-content');
        const titleEl = document.getElementById('article-title');
        const dateEl = document.getElementById('article-date');

        if (!file) {
            container.innerHTML = '<p style="color:#b33;padding:1rem;">URL 里没有 file 参数</p>';
            return;
        }
        if (titleParam) titleEl.textContent = titleParam;
        const m = file.match(/^(\d{4}-\d{2}-\d{2})/);
        if (m) dateEl.textContent = m[1];

        const url = '../news/posts/' + file;

        try {
            const res = await fetch(url);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const text = await res.text();

            console.log('[news] marked 可用:', typeof marked !== 'undefined', marked && marked.version);

            if (typeof marked === 'undefined') {
                container.innerHTML = '<p style="color:#b33;padding:1rem;">marked.js 加载失败（三个 CDN 都没拿到）。请检查网络。</p>';
                return;
            }

            // 兼容不同版本 API
            const html = marked.parse ? marked.parse(text) : marked(text);
            container.innerHTML = html;

            // 渲染后自检：如果没生成任何 Markdown 标签，说明解析异常
            if (container.querySelectorAll('h1,h2,h3,ul,ol,strong,code').length === 0 && text.trim().length > 0) {
                container.innerHTML = '<p style="color:#b33;padding:1rem;">marked 已加载但未解析出 HTML，请把控制台日志发给我。</p>' +
                    '<pre style="white-space:pre-wrap;">' + text.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</pre>';
            }
        } catch (err) {
            container.innerHTML = '<p style="color:#b33;padding:1rem;">文章加载失败：' + err.message + '<br>请求地址：' + url + '</p>';
        }
    });
    </script>
</body>
</html>
