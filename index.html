<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沈阳市南昌初级中学 · 科技部</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="main-container">
        <!-- 头部 -->
        <header class="header">
            <!-- Logo：替换为 <img src="images/logo.png" alt="logo" class="logo-img"> -->
            <div class="logo">
                <i class="fas fa-microchip"></i>
            </div>
            <div class="welcome">
                <h1>欢迎来到沈阳市南昌初级中学2026级学生会科技部官网！</h1>
                <div class="subhead">
                    <i class="fas fa-code"></i> 创新 · 协作 · 探索未来
                </div>
            </div>
        </header>

        <!-- 人物介绍入口 -->
        <div class="section-title">
            <h2><i class="fas fa-users"></i> 科技部成员</h2>
        </div>
        <p class="section-desc">点击下方卡片查看成员详细介绍</p>

        <div class="members-grid">
            <!-- 成员1 -->
            <a href="pages/member1.html" class="member-card">
                <div class="avatar"><i class="fas fa-user-astronaut"></i></div>
                <div class="member-name">姓名占位</div>
                <div class="member-role">科技部部长</div>
                <div class="card-arrow"><i class="fas fa-arrow-right"></i></div>
            </a>
            <!-- 成员2 -->
            <a href="pages/member2.html" class="member-card">
                <div class="avatar"><i class="fas fa-user-graduate"></i></div>
                <div class="member-name">姓名占位</div>
                <div class="member-role">科技部副部长</div>
                <div class="card-arrow"><i class="fas fa-arrow-right"></i></div>
            </a>
            <!-- 成员3 -->
            <a href="pages/member3.html" class="member-card">
                <div class="avatar"><i class="fas fa-user-robot"></i></div>
                <div class="member-name">姓名占位</div>
                <div class="member-role">技术组组长</div>
                <div class="card-arrow"><i class="fas fa-arrow-right"></i></div>
            </a>
            <!-- 成员4 -->
            <a href="pages/member4.html" class="member-card">
                <div class="avatar"><i class="fas fa-user-cog"></i></div>
                <div class="member-name">姓名占位</div>
                <div class="member-role">创意策划</div>
                <div class="card-arrow"><i class="fas fa-arrow-right"></i></div>
            </a>
        </div>

        <div class="info-note">
            <div><i class="fas fa-images"></i> <strong>Logo 图片：</strong>放到 <code>images/logo.png</code>，并把首页 logo 区域换成 <code>&lt;img src="images/logo.png" alt="logo"&gt;</code>。</div>
            <div><i class="fas fa-markdown"></i> <strong>成员介绍：</strong>编辑 <code>members/member1.md</code> 等文件即可，页面会自动渲染。</div>
        </div>
    </div>
</body>
</html>
